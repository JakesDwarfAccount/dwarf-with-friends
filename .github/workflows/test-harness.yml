name: Offline checks

on:
  pull_request:
  push:
    branches: [main, "wt/beta4-native-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Decode the wire fixture
        run: node tools/harness/wire_decode_test.mjs
      - name: Check generated Lua
        run: node tools/lua/build_dwf_lua.mjs --check
      - name: Check asset stamps
        run: node tools/harness/stamp_busters.mjs --check
      - name: Check browser dependencies
        run: node tools/architecture/browser_dependency_inventory.mjs
